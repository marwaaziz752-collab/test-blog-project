content:
  - name: blog
    label: Blog
    path: src/content/blog
    type: collection
    filename: '{fields.slug}.md'
    fields:
      - name: title
        label: Title
        type: string
      - name: slug
        label: Slug
        type: string
      - name: author
        label: Author
        type: string
      - name: pubDate
        label: Publication Date
        type: date
      - name: image
        label: Image URL
        type: string
      - name: tags
        label: Tags
        type: string
        list: true
      - name: description
        label: Description
        type: text
      - name: metaTitle
        label: SEO Meta Title
        type: string
      - name: metaDescription
        label: SEO Meta Description
        type: text
      - name: focusKeyword
        label: Focus Keyword
        type: string
      - name: ogImage
        label: Open Graph Image URL
        type: string
      - name: twitterCard
        label: Twitter Card Type
        type: string
      - name: noindex
        label: No Index (hide from search engines)
        type: boolean
      - name: hreflang
        label: Hreflang (e.g. en-us)
        type: string
      - name: faqs
        label: FAQs
        type: object
        list: true
        fields:
          - name: question
            label: Question
            type: string
          - name: answer
            label: Answer
            type: text
      - name: ctaHeading
        label: CTA Heading
        type: string
      - name: ctaText
        label: CTA Text
        type: text
      - name: ctaButtonLabel
        label: CTA Button Label
        type: string
      - name: ctaButtonUrl
        label: CTA Button URL
        type: string
      - name: body
        label: Body
        type: rich-text
        options:
          path: src/assets/blog
          extensions: [jpg, jpeg, png, webp]